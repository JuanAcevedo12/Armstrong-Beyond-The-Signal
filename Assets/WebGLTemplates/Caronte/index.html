<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{{ PRODUCT_NAME }}}</title><link rel="icon" href="caronte-icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030b15;color:#d9f5ff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#shell{position:absolute;inset:0;display:grid;place-items:center}canvas{width:100%;height:100%;background:#030b15;outline:none}
#cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#102c40,#030b15);text-align:center;padding:24px}
#cover img{width:144px;height:144px;object-fit:cover;border-radius:22px;box-shadow:0 0 42px #3adfff26}h1{letter-spacing:.22em;font-size:34px;margin:24px 0 8px}p{color:#99baca;line-height:1.7;margin:8px}button{font:inherit;color:#ddfaff;background:#12364a;border:1px solid #45daf7;border-radius:5px;padding:13px 24px;cursor:pointer;margin-top:18px}button:hover{background:#205166}progress{width:260px;accent-color:#42dcff;margin:16px}#status{max-width:640px;white-space:pre-wrap}#full{position:absolute;right:12px;bottom:10px;margin:0;padding:7px 10px;background:#031322b8;font-size:12px}#hint{font-size:13px}
@media(pointer:coarse){#full{display:none}#cover{padding:12px}#cover img{width:88px;height:88px}h1{font-size:26px;margin:10px 0 4px}p{font-size:13px;line-height:1.3;margin:5px}button{margin-top:8px}}
</style></head><body>
<div id="shell"><canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0" aria-label="CARONTE Mission Architect"></canvas></div>
<div id="cover"><img src="caronte-icon.png" alt="CARONTE"><h1>CARONTE</h1><p>MISSION ARCHITECT</p><p id="hint">WASD · Desplazarse &nbsp; | &nbsp; Ratón · Mirar<br>E · Consola &nbsp; | &nbsp; Esc · Pausa</p><button id="start">INICIAR MISIÓN</button><progress id="progress" value="0" max="1" hidden></progress><p id="status">Para navegadores de escritorio. Activa el sonido.</p></div>
<button id="full" title="Pantalla completa">⛶ Pantalla completa</button>
<script>
const canvas=document.getElementById('unity-canvas'),cover=document.getElementById('cover'),status=document.getElementById('status'),progress=document.getElementById('progress');
const mobileTouch=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)||((navigator.maxTouchPoints||0)>0&&(window.matchMedia('(pointer:coarse)').matches||/Macintosh/.test(navigator.userAgent)));
if(mobileTouch){document.getElementById('hint').innerHTML='Joystick · Mover / Move<br>Arrastra · Mirar / Drag to look';status.textContent='Controles táctiles · Touch controls. Usa el móvil en horizontal / Use landscape.';}
let instance;
// A background tab cannot capture the pointer. Treat focus races as a deferred request.
const nativePointerLock=Element.prototype.requestPointerLock;
if(nativePointerLock){
 Element.prototype.requestPointerLock=function(...args){
  if(!this.isConnected||this.ownerDocument!==document||document.visibilityState!=='visible'||!document.hasFocus())return;
  try{
   const result=nativePointerLock.apply(this,args);
   if(result&&typeof result.catch==='function')return result.catch(error=>{
    if(error.name==='WrongDocumentError'||error.name==='NotAllowedError'){console.warn('CARONTE: haz clic en el juego para recuperar el ratón.');return;}
    throw error;
   });
   return result;
  }catch(error){
   if(error.name==='WrongDocumentError'||error.name==='NotAllowedError'){console.warn('CARONTE: haz clic en el juego para recuperar el ratón.');return;}
   throw error;
  }
 };
}

document.getElementById('start').onclick=function(){
 this.hidden=true;progress.hidden=false;status.textContent='Cargando la estación…';
 const script=document.createElement('script');script.src='Build/{{{ LOADER_FILENAME }}}';
 script.onerror=()=>{status.textContent='No se pudo descargar el cargador. Recarga la página.'};
 script.onload=()=>createUnityInstance(canvas,{
 dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',
 streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},
 autoSyncPersistentDataPath:true,
 devicePixelRatio:mobileTouch?1:Math.min(window.devicePixelRatio||1,1.5),
 showBanner:(message,type)=>{console[type==='error'?'error':'warn'](message);if(type==='error'){status.textContent=message;cover.style.display='flex'}},
},p=>{progress.value=p;status.textContent='Cargando la estación… '+Math.round(p*100)+'%'}).then(u=>{instance=u;window.caronteUnity=u;cover.style.display='none';canvas.focus();}).catch(e=>{status.textContent='No se pudo iniciar CARONTE: '+e;console.error(e)});
 document.body.appendChild(script);
};
document.getElementById('full').onclick=()=>{if(instance)instance.SetFullscreen(1)};
canvas.addEventListener('pointerdown',()=>canvas.focus());
window.addEventListener('error',e=>console.error('CARONTE browser error:',e.message));
</script></body></html>
